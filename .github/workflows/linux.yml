name: Linux validation
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.11', '3.14']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: sudo apt-get update && sudo apt-get install -y xvfb python3-tk
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pip check
      - run: python -m unittest discover -s tests -v
      - run: xvfb-run -a python tests/integration.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gui-evidence-${{ matrix.python }}
          path: tests/runtime-artifacts/
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: sudo apt-get update && sudo apt-get install -y xvfb python3-tk
      - run: python -m pip install -r requirements-dev.txt
      - run: python build_exe.py --onedir --console
      - name: Smoke-test bundled startup
        run: |
          set +e
          xvfb-run -a timeout 10s dist/StarlinkMonitor/StarlinkMonitor > smoke.log 2>&1
          result=$?
          cat smoke.log
          test "$result" -eq 124 || exit 1
          if grep -Eq 'Traceback|Failed to compile proto|Failed to execute' smoke.log; then exit 1; fi
      - uses: actions/upload-artifact@v4
        with:
          name: StarlinkMonitor-linux
          path: dist/StarlinkMonitor/
