name: Desktop validation
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
        python: ['3.11', '3.14']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: sudo apt-get update && sudo apt-get install -y xvfb python3-tk
        if: runner.os == 'Linux'
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pip check
      - run: python -m unittest discover -s tests -v
      - run: xvfb-run -a python tests/integration.py
        if: runner.os == 'Linux'
      - run: python tests/integration.py
        if: runner.os == 'Windows'
      - run: xvfb-run -a python tests/integration.py --offline
        if: runner.os == 'Linux'
      - run: python tests/integration.py --offline
        if: runner.os == 'Windows'
      - run: xvfb-run -a python tests/integration.py --offline --dish-location
        if: runner.os == 'Linux'
      - run: python tests/integration.py --offline --dish-location
        if: runner.os == 'Windows'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gui-evidence-${{ matrix.os }}-${{ matrix.python }}
          path: tests/runtime-artifacts/
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: sudo apt-get update && sudo apt-get install -y xvfb python3-tk
        if: runner.os == 'Linux'
      - run: python -m pip install -r requirements-dev.txt
      - run: python build_exe.py --onedir
      - run: xvfb-run -a python tests/smoke_build.py dist/StarlinkMonitor/StarlinkMonitor
        if: runner.os == 'Linux'
      - run: python tests/smoke_build.py dist/StarlinkMonitor/StarlinkMonitor.exe
        if: runner.os == 'Windows'
      - uses: actions/upload-artifact@v4
        with:
          name: StarlinkMonitor-${{ matrix.os }}
          path: dist/StarlinkMonitor/
      - name: Build Windows single-file executable
        if: runner.os == 'Windows'
        run: python build_exe.py
      - name: Smoke-test Windows single-file executable
        if: runner.os == 'Windows'
        run: python tests/smoke_build.py dist/StarlinkMonitor.exe
      - uses: actions/upload-artifact@v4
        if: runner.os == 'Windows'
        with:
          name: StarlinkMonitor-windows-onefile
          path: dist/StarlinkMonitor.exe
